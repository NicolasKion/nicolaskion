# Production, deployed by Coolify (Docker Compose build pack, this file)
# from the images .github/workflows/release.yml pushes to GHCR on every
# merge to main.
#
# Only the proxy gets a domain: in Coolify set nicolaskion-proxy's
# "Domains" to https://nicolaskion.dev,https://www.nicolaskion.dev and
# leave the api and frontend without one. Traefik terminates TLS and hands
# plain HTTP to the proxy on :80, which redirects www to the apex and
# routes to the api and the frontend (deploy/Caddyfile).
#
# The services carry the app's prefix so their names stay unique next to
# the other apps on the server. No database: the GitHub and ESI data are
# cached in the api's memory, so nothing joins the coolify network.
#
# The tournament-tool update feed is the host directory
# /srv/nicolaskion/update-feed, which the proxy serves read-only and the
# tournament-tool release workflow uploads into (README, "Update feed").
#
# Coolify fills in the ${VAR}s from the resource's environment variables:
# GITHUB_TOKEN and EVE_CHARACTER_ID, the rest have the app's defaults.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nicolaskion-api:
    image: ghcr.io/nicolaskion/nicolaskion-api:latest
    pull_policy: always
    environment:
      BIND_ADDR: 0.0.0.0:3000
      APP_URL: ${APP_URL:-https://nicolaskion.dev}
      APP_NAME: ${APP_NAME:-}
      RUST_LOG: ${RUST_LOG:-info}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      EVE_CHARACTER_ID: ${EVE_CHARACTER_ID:-}
      ESI_URL: ${ESI_URL:-}
    # The image has no curl or wget; bash talks HTTP to /up itself.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /up HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  nicolaskion-frontend:
    image: ghcr.io/nicolaskion/nicolaskion-frontend:latest
    pull_policy: always
    environment:
      AXUM_URL: http://nicolaskion-api:3000
      ORIGIN: ${APP_URL:-https://nicolaskion.dev}
      # adapter-node takes the page origin (canonical URL, Inertia reloads)
      # from the headers the proxy forwards.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      - nicolaskion-api
    restart: unless-stopped
    logging: *logging

  nicolaskion-proxy:
    image: ghcr.io/nicolaskion/nicolaskion-proxy:latest
    pull_policy: always
    environment:
      API_HOST: nicolaskion-api
      FRONTEND_HOST: nicolaskion-frontend
    volumes:
      - /srv/nicolaskion/update-feed:/srv/nicolaskion/update-feed:ro
    depends_on:
      - nicolaskion-api
      - nicolaskion-frontend
    restart: unless-stopped
    logging: *logging
