name: logos

# Once a month, downloads the featured project logos from their source
# repositories (src/featured.rs) and opens a pull request when one changed.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: false

      - name: Sync logos
        run: cargo run --locked --bin sync_logos

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sync-logos
        run: |
          if git diff --quiet -- frontend/static/logos; then
            echo "Logos are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add frontend/static/logos
          git commit -m "chore: sync featured project logos"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "chore: sync featured project logos" --body "Updates the featured project logos from their source repositories."
          fi
